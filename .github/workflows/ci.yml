name: Windows ARM npm startup diagnosis

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact diagnostic commit SHA, not release acceptance
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-arm-startup-diagnostic-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - name: Require the exact diagnostic revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$GITHUB_REF" = refs/heads/diagnose/windows-arm-npm-launch
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          architecture: arm64
          cache: pnpm
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raidiant/notifai-protocol build
      - run: pnpm --filter @raidiant/notifai build
      - name: Trace unchanged registry bytes from the failed candidate
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/registry-candidate.tgz"
          release_sha=37d101646cfa1285da93581357244f10d79ca297
          node scripts/verify-published.mjs @raidiant/notifai --expected-sha "$release_sha" --artifact-output "$tarball"
          node scripts/diagnose-windows-npm-startup.mjs --cli-tarball "$tarball" --expected-sha "$release_sha" --owned-hosted-account --report-path "$RUNNER_TEMP/notifai-windows-npm-startup.json"
      - name: Retain diagnostic timings, never release acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm-startup-diagnostic-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/notifai-windows-npm-startup*.json*
          if-no-files-found: warn
          retention-days: 30
