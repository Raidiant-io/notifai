name: CI

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA that this run must check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-ci-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject a stale release candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "The dispatched ref no longer resolves to expected_sha" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install verified gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_TARBALL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --remote-name \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_TARBALL_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Prove redacted detection and scan the release history
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-secrets.mjs --mode controls
          node scripts/check-secrets.mjs --mode tree
          node scripts/check-secrets.mjs --mode full

  gates:
    needs: scope
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail when exact candidate admission did not succeed
        if: needs.scope.result != 'success'
        run: |
          echo "Exact release candidate admission did not succeed" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        shell: bash
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            pnpm check:commit
          else
            base=$(git merge-base origin/main HEAD)
            pnpm exec commitlint --from "$base" --to HEAD --verbose
          fi

      - name: Build public packages
        run: pnpm build

      - name: Run public unit tests
        run: pnpm -r test

      - name: Typecheck public packages
        run: pnpm -r typecheck

      - name: Lint public packages
        run: pnpm lint

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate --ignore-registry-errors

      - name: Prove public boundary canaries
        run: pnpm check:boundary:self-test

      - name: Verify public boundary
        run: pnpm check:boundary

      - name: Verify agent guidance tests
        run: pnpm check:agent-guidance:test

      - name: Verify agent guidance
        run: pnpm check:agent-guidance

      - name: Verify release metadata and package contents
        run: pnpm check:release

      - name: Verify registry-shaped packed installation
        run: pnpm check:packed

      - name: Verify packed skill installer when the adapter, pin, or bundle changed
        run: pnpm check:packed-skill-smoke -- --if-changed

      - name: Verify public provider posture
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-public-provider-posture.mjs

  platform-macos:
    name: platform (macos-latest)
    needs: scope
    if: >-
      always() && needs.scope.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raidiant/notifai-protocol build
      - name: Verify the macOS wake boundary
        run: pnpm --filter @raidiant/notifai test -- src/codex-wake.test.ts

  platform-windows-x64:
    name: platform (windows-2025)
    needs: scope
    if: >-
      always() && needs.scope.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raidiant/notifai-protocol build
      - name: Record the native Windows evidence environment
        shell: pwsh
        run: |
          "runner_image=$env:ImageOS"
          "runner_image_version=$env:ImageVersion"
          "windows=$([System.Environment]::OSVersion.VersionString)"
          "process_arch=$(node -p process.arch)"
          "node=$(node --version)"
          "npm=$(npm --version)"
          "pnpm=$(pnpm --version)"
          "powershell=$($PSVersionTable.PSVersion)"
          git --version
      - name: Run native Windows boundaries
        shell: bash
        run: |
          pnpm --filter @raidiant/notifai-protocol test
          pnpm --filter @raidiant/notifai test -- \
            src/platform.test.ts src/credentials.test.ts src/ui/config-view.test.ts
          pnpm --filter @raidiant/notifai test -- \
            src/hook-adapter.test.ts src/install-hooks.test.ts \
            --testNamePattern Windows
          pnpm --filter @raidiant/notifai test -- \
            src/hooks.test.ts src/commands.test.ts \
            --testNamePattern "Windows Claude"
      - name: Verify the packed CLI through native Windows shells
        run: pnpm check:packed
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.12.0'
          cache: pnpm
      - name: Prove concurrent adapter installation on minimum Node
        run: >-
          pnpm --filter @raidiant/notifai test -- src/hook-adapter.test.ts
          --testNamePattern "concurrent Windows installers"

  platform-windows-arm:
    name: platform (windows-11-arm)
    needs: scope
    if: >-
      always() && needs.scope.result == 'success'
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raidiant/notifai-protocol build
      - name: Record the native Windows evidence environment
        shell: pwsh
        run: |
          "runner_image=$env:ImageOS"
          "runner_image_version=$env:ImageVersion"
          "windows=$([System.Environment]::OSVersion.VersionString)"
          "process_arch=$(node -p process.arch)"
          "node=$(node --version)"
          "npm=$(npm --version)"
          "pnpm=$(pnpm --version)"
          "powershell=$($PSVersionTable.PSVersion)"
          git --version
      - name: Run native Windows boundaries
        shell: bash
        run: |
          pnpm --filter @raidiant/notifai-protocol test
          pnpm --filter @raidiant/notifai test -- \
            src/platform.test.ts src/credentials.test.ts src/ui/config-view.test.ts
          pnpm --filter @raidiant/notifai test -- \
            src/hook-adapter.test.ts src/install-hooks.test.ts \
            --testNamePattern Windows
      - name: Verify the packed CLI through native Windows shells
        run: pnpm check:packed
