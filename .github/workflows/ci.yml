name: CI

on:
  push:
    branches: [main]
    tags: ['v*', 'protocol-v*']
  pull_request:

permissions:
  contents: read

jobs:
  # Prove the public sending surface on every supported desktop OS and at both
  # ends of the Node range. Windows and macOS run the release package check too:
  # it executes the platform's real package-manager shims and inspects pnpm pack.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Protocol before CLI: the CLI resolves its built exports.
      - run: pnpm build

      # Platform-agnostic suites run once on Ubuntu. Each host also runs the
      # focused tests that exercise its real process, path, credential, and hook
      # adapter behavior; the CLI's simulated-platform tests still cover every
      # branch from the common suite.
      - name: Run platform tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            pnpm -r test
          else
            pnpm --filter @raidiant/notifai-protocol test
            if [ "${{ runner.os }}" = "Windows" ]; then
              pnpm --filter @raidiant/notifai test -- \
                src/platform.test.ts src/credentials.test.ts src/ui/config-view.test.ts
              pnpm --filter @raidiant/notifai test -- \
                src/hook-adapter.test.ts src/install-hooks.test.ts \
                --testNamePattern="Windows"
            else
              pnpm --filter @raidiant/notifai test -- src/codex-wake.test.ts
            fi
          fi

      - run: pnpm -r typecheck

      - run: pnpm lint

      # Checks the actual pnpm pack file list, package metadata, license/docs,
      # production dependency licenses, and CLI version single source.
      - run: pnpm check:release

  # Install the packed CLI outside the workspace, registry-shaped, and prove
  # the installed bin starts. This is the only pre-publish gate that can catch
  # the packed manifest pinning a protocol version other than the one packed
  # beside it — workspace linking hides that from every other job. Needs
  # registry access for the CLI's public dependencies; needs no credentials.
  packed-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:packed

  # Platform-independent policy gates run once on the Node ceiling.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      # First, because a boundary violation makes the rest moot.
      - run: pnpm check:boundary:self-test

      - run: pnpm check:boundary

  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
          # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, reviewed with the version pin.
          GITLEAKS_TARBALL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --remote-name \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_TARBALL_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - run: node scripts/check-secrets.mjs

  commits:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # GitHub uses the PR title as the squash commit subject. Lint it before
      # merge so every commit release-please sees on main is conventional.
      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Lint commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD --verbose
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            pnpm check:commit
          else
            pnpm exec commitlint --from "${{ github.event.before }}" --to HEAD --verbose
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, BSD-3-Clause, ISC, MIT
