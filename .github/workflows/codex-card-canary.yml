name: Codex card canary

# The one clock-driven workflow in this repository. Every other hosted workflow
# is exact-SHA release evidence; this one watches an external dependency, the
# newest published Codex CLI, for drift in the app-server surface that lets a
# device answer close a Codex question card. See docs/CODEX-CARD-CANARY.md for
# what a green run proves and what it does not. It needs no account, no model
# and no secret: the model is a local mock.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codex-card-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the shipped transport the canary drives
        run: pnpm build

      - name: Install the newest published Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @openai/codex@latest
          codex --version

      - name: Prove the canary's own checks before trusting them
        run: node --test scripts/codex-card-canary.test.mjs

      - name: Run the card round trip against the newest Codex
        shell: bash
        run: |
          set -euo pipefail
          node scripts/codex-card-canary.mjs --summary "$GITHUB_STEP_SUMMARY" --out codex-card-canary.json

      - name: Retain the canary record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-card-canary-${{ github.run_id }}
          path: codex-card-canary.json
          if-no-files-found: ignore
          retention-days: 30
