name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@5682af4970731d2b0c53c5e2aeed9864c1fcb77d # v4.3.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
