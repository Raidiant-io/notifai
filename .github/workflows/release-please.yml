name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v4.4.1 bundles release-please 17.3.0. The config schema is pinned to
      # that executable version; evaluate action upgrades as separate changes.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release-please
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please leaves two things behind on every release branch: the
      # root README version markers (it cannot edit files outside a package
      # directory — `extra-files` rejects `../`) and `pnpm-lock.yaml` (it bumps
      # the CLI's protocol pin in package.json only, which fails CI with
      # ERR_PNPM_OUTDATED_LOCKFILE). Both are repaired here. The PAT keeps
      # required checks running on the pushed commit; the default workflow
      # token would not trigger them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release-please.outputs.prs_created == 'true' }}
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ steps.release-please.outputs.prs_created == 'true' }}
        with:
          version: 10.34.5
      - name: Sync README markers and lockfile on release branches
        if: ${{ steps.release-please.outputs.prs_created == 'true' }}
        env:
          PRS: ${{ steps.release-please.outputs.prs }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for branch in $(node -e 'for (const pr of JSON.parse(process.env.PRS)) console.log(pr.headBranchName)'); do
            git checkout "$branch"
            node scripts/sync-readme-markers.mjs
            pnpm install --lockfile-only
            if git diff --quiet -- README.md pnpm-lock.yaml; then
              echo "release branch $branch already consistent"
            else
              git add README.md pnpm-lock.yaml
              git commit -m "chore(release): sync README markers and lockfile"
              git push origin "HEAD:$branch"
            fi
          done
