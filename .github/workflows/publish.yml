name: publish

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact tagged commit SHA that this run must publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject a stale or non-tag dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "The dispatched tag no longer resolves to expected_sha" >&2
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*|refs/tags/protocol-v*) ;;
            *)
              echo "publish.yml accepts only release tags" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require an immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/check-public-provider-posture.mjs
          --release-tag "$GITHUB_REF_NAME"
          --expected-sha "${{ inputs.expected_sha }}"

  npm:
    needs: dispatch-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      cli_version: ${{ steps.cli-version.outputs.version }}
      verify_cli: ${{ steps.plan.outputs.verify_cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Require an npm CLI with trusted-publishing support
        run: node scripts/check-npm-trusted-publishing.mjs

      - run: pnpm install --frozen-lockfile

      - name: Verify the clean release checkout
        run: |
          pnpm check:boundary:self-test
          pnpm check:boundary
          pnpm build
          pnpm -r test
          pnpm lint
          pnpm -r typecheck
          pnpm check:release
          pnpm check:packed

      - name: Plan idempotent package publication
        id: plan
        run: node scripts/plan-publish.mjs

      - name: Record the exact CLI version
        id: cli-version
        shell: bash
        run: node -e "process.stdout.write('version=' + require('./apps/cli/package.json').version + '\\n')" >> "$GITHUB_OUTPUT"

      # Protocol must reach the registry before a CLI that pins it exactly.
      - name: Publish protocol with OIDC provenance
        if: ${{ steps.plan.outputs.publish_protocol == 'true' }}
        working-directory: packages/protocol
        run: npm publish --access public --provenance

      - name: Verify published protocol bytes and metadata
        if: ${{ steps.plan.outputs.verify_protocol == 'true' }}
        run: node scripts/verify-published.mjs @raidiant/notifai-protocol

      - name: Publish CLI with OIDC provenance
        if: ${{ steps.plan.outputs.publish_cli == 'true' }}
        working-directory: apps/cli
        run: npm publish --access public --provenance

      - name: Verify published CLI bytes and metadata
        if: ${{ steps.plan.outputs.verify_cli == 'true' }}
        run: node scripts/verify-published.mjs @raidiant/notifai

  windows-cli:
    needs: npm
    if: needs.npm.outputs.verify_cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify the exact published CLI through native Windows shells
        run: node scripts/verify-published-windows.mjs "${{ needs.npm.outputs.cli_version }}"
