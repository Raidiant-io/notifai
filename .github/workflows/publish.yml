name: publish

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact tagged commit SHA that this run must publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: read
      contents: read
    steps:
      - name: Reject a stale or non-tag dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "The dispatched tag no longer resolves to expected_sha" >&2
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/installer-v*|refs/tags/protocol-v*) ;;
            *)
              echo "publish.yml accepts only release tags" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require an immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/check-public-provider-posture.mjs
          --release-tag "$GITHUB_REF_NAME"
          --expected-sha "${{ inputs.expected_sha }}"

      - name: Require successful CI evidence at the exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require-ci-evidence.mjs --expected-sha "${{ inputs.expected_sha }}"

  npm:
    needs: dispatch-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Require an npm CLI with trusted-publishing support
        run: node scripts/check-npm-trusted-publishing.mjs

      - run: pnpm install --frozen-lockfile

      - name: Install verified gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_TARBALL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --remote-name \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_TARBALL_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Verify release-specific artifact tooling
        run: |
          node --test \
            scripts/check-packed-boundary.test.mjs \
            scripts/verify-packed-install.test.mjs \
            scripts/verify-published.test.mjs

      - name: Plan idempotent package publication
        id: plan
        run: node scripts/plan-publish.mjs

      - name: Pack once and verify the exact npm artifact
        env:
          PACKAGE_NAME: ${{ steps.plan.outputs.package_name }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/notifai-npm-artifact"
          mkdir -p "$artifact_root"
          pnpm --filter "$PACKAGE_NAME" pack --pack-destination "$artifact_root"
          mapfile -t artifacts < <(find "$artifact_root" -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#artifacts[@]}" -eq 1
          tarball="${artifacts[0]}"
          echo "NPM_TARBALL=$tarball" >> "$GITHUB_ENV"
          node scripts/check-packed-boundary.mjs --tarball "$tarball" --gitleaks
          if [ "$PACKAGE_NAME" = '@raidiant/notifai-install' ]; then
            node scripts/verify-packed-npm-installer.mjs "$tarball"
          fi

      - name: Require a usable signed default for the npm installer
        if: steps.plan.outputs.package_name == '@raidiant/notifai-install'
        run: node scripts/check-npm-bootstrap-release.mjs

      - name: Verify an existing package before declaring a retry successful
        if: steps.plan.outputs.publish == 'false'
        env:
          PACKAGE_NAME: ${{ steps.plan.outputs.package_name }}
        run: node scripts/verify-published.mjs "$PACKAGE_NAME" --expected-tarball "$NPM_TARBALL"

      - name: Record npm distribution tags before publication
        if: steps.plan.outputs.publish == 'true'
        env:
          PACKAGE_NAME: ${{ steps.plan.outputs.package_name }}
        run: node scripts/verify-npm-distribution.mjs snapshot "$RUNNER_TEMP/npm-dist-tags-before.json" "$PACKAGE_NAME"

      - name: Build protocol for the live service contract check
        if: steps.plan.outputs.publish == 'true'
        run: pnpm --filter @raidiant/notifai-protocol build

      - name: Verify deployed service accepts this candidate
        if: steps.plan.outputs.publish == 'true'
        run: node scripts/check-live-server-contract.mjs

      - name: Publish the selected npm package with OIDC provenance
        if: steps.plan.outputs.publish == 'true'
        env:
          NPM_DIST_TAG: ${{ steps.plan.outputs.npm_dist_tag }}
        run: npm publish "$NPM_TARBALL" --access public --provenance --tag "$NPM_DIST_TAG"

      - name: Verify published package bytes and metadata
        if: steps.plan.outputs.publish == 'true'
        env:
          PACKAGE_NAME: ${{ steps.plan.outputs.package_name }}
        run: node scripts/verify-published.mjs "$PACKAGE_NAME" --expected-tarball "$NPM_TARBALL"

      - name: Verify npm distribution
        if: steps.plan.outputs.publish == 'true'
        env:
          PACKAGE_NAME: ${{ steps.plan.outputs.package_name }}
        run: node scripts/verify-npm-distribution.mjs verify "$RUNNER_TEMP/npm-dist-tags-before.json" "$PACKAGE_NAME"
