name: publish

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact tagged commit SHA that this run must publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject a stale or non-tag dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "The dispatched tag no longer resolves to expected_sha" >&2
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*|refs/tags/protocol-v*) ;;
            *)
              echo "publish.yml accepts only release tags" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require an immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/check-public-provider-posture.mjs
          --release-tag "$GITHUB_REF_NAME"
          --expected-sha "${{ inputs.expected_sha }}"

  npm:
    needs: dispatch-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      cli_version: ${{ steps.cli-version.outputs.version }}
      verify_cli: ${{ steps.plan.outputs.verify_cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Require an npm CLI with trusted-publishing support
        run: node scripts/check-npm-trusted-publishing.mjs

      - run: pnpm install --frozen-lockfile

      - name: Install verified gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_TARBALL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --remote-name \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_TARBALL_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Verify the clean release checkout
        run: |
          pnpm check:boundary:self-test
          pnpm check:boundary
          pnpm build
          pnpm -r test
          pnpm lint
          pnpm -r typecheck
          pnpm check:release
          node --test \
            scripts/check-packed-boundary.test.mjs \
            scripts/verify-packed-install.test.mjs \
            scripts/verify-published.test.mjs

      - name: Plan idempotent package publication
        id: plan
        run: node scripts/plan-publish.mjs

      - name: Record the exact CLI version
        id: cli-version
        shell: bash
        run: node -e "process.stdout.write('version=' + require('./apps/cli/package.json').version + '\\n')" >> "$GITHUB_OUTPUT"

      - name: Pack once and verify the exact release artifacts
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/notifai-npm-artifacts"
          mkdir -p "$artifact_root/protocol" "$artifact_root/cli"
          pnpm --filter @raidiant/notifai-protocol pack \
            --pack-destination "$artifact_root/protocol"
          pnpm --filter @raidiant/notifai pack \
            --pack-destination "$artifact_root/cli"

          mapfile -t protocol_artifacts < <(find "$artifact_root/protocol" -maxdepth 1 -type f -name '*.tgz' -print)
          mapfile -t cli_artifacts < <(find "$artifact_root/cli" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#protocol_artifacts[@]}" -ne 1 ] || [ "${#cli_artifacts[@]}" -ne 1 ]; then
            echo "Expected exactly one protocol tarball and one CLI tarball" >&2
            exit 1
          fi
          protocol_tarball="${protocol_artifacts[0]}"
          cli_tarball="${cli_artifacts[0]}"
          {
            echo "PROTOCOL_TARBALL=$protocol_tarball"
            echo "CLI_TARBALL=$cli_tarball"
          } >> "$GITHUB_ENV"

          node scripts/verify-packed-install.mjs \
            --protocol-tarball "$protocol_tarball" \
            --cli-tarball "$cli_tarball" \
            --gitleaks

      # Protocol must reach the registry before a CLI that pins it exactly.
      - name: Publish protocol with OIDC provenance
        if: ${{ steps.plan.outputs.publish_protocol == 'true' }}
        run: npm publish "$PROTOCOL_TARBALL" --access public --provenance

      - name: Verify published protocol bytes and metadata
        if: ${{ steps.plan.outputs.verify_protocol == 'true' }}
        run: >-
          node scripts/verify-published.mjs @raidiant/notifai-protocol
          --expected-tarball "$PROTOCOL_TARBALL"

      - name: Publish CLI with OIDC provenance
        if: ${{ steps.plan.outputs.publish_cli == 'true' }}
        run: npm publish "$CLI_TARBALL" --access public --provenance

      - name: Verify published CLI bytes and metadata
        if: ${{ steps.plan.outputs.verify_cli == 'true' }}
        run: >-
          node scripts/verify-published.mjs @raidiant/notifai
          --expected-tarball "$CLI_TARBALL"

  windows-cli:
    needs: npm
    if: needs.npm.outputs.verify_cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify the exact published CLI through native Windows shells
        run: node scripts/verify-published-windows.mjs "${{ needs.npm.outputs.cli_version }}"
